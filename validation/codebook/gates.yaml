# English translation of the Polish codebook (version 1.0, 2026-08-28) shown to the coders;
# where the two differ, the Polish original prevails.
version: "1.0"
date: "2026-08-28"
language: en
translated_from: pl
mode: gates

placeholders:
  n_maps: "number of maps assigned to this coder"

